-size="18" fill="#a78bfa">执行与记录</text><text x="550.0" y="204" text-anchor="middle" font-size="14" fill="#cbd5e1">配置、输出、复测</text><rect x="670" y="145" width="180" height="90" rx="9" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6"/><text x="760.0" y="177" text-anchor="middle" font-size="18" fill="#22d3ee">结论与限制</text><text x="760.0" y="204" text-anchor="middle" font-size="14" fill="#cbd5e1">能证明到哪一步</text><rect x="880" y="145" width="180" height="90" rx="9" fill="#0f172a" stroke="#34d399" stroke-width="1.6"/><text x="970.0" y="177" text-anchor="middle" font-size="18" fill="#34d399">下一步决策</text><text x="970.0" y="204" text-anchor="middle" font-size="14" fill="#cbd5e1">继续、整改或暂缓</text><path d="M550 235V295" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="260" y="295" width="580" height="75" rx="9" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/><text x="550.0" y="327" text-anchor="middle" font-size="18" fill="#fb923c">条件或版本变化：检查受影响用例并重新验证</text><text x="550.0" y="354" text-anchor="middle" font-size="14" fill="#cbd5e1">调试结果与独立评估结果分别保留</text><text x="40" y="412" text-anchor="start" font-size="14" fill="#94a3b8">原创示意图｜模拟、回放、实测和生产观察分别标识</text></g></svg></section><section><h2>11 交接变更流程</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-label="交接、条件复核与变更"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs><rect width="1100" height="510" rx="16" fill="#020617"/><rect width="1100" height="510" rx="16" fill="url(#grid)"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="52" fill="#f8fafc" font-size="25" font-weight="700">交接、条件复核与变更</text><text x="40" y="84" fill="#94a3b8" font-size="15">收到文件不等于理解一致；每个未决项需要接手人和下一步</text><path d="M250 190H295" f
