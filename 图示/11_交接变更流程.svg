<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-label="交接、条件复核与变更"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs><rect width="1100" height="510" rx="16" fill="#020617"/><rect width="1100" height="510" rx="16" fill="url(#grid)"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="52" fill="#f8fafc" font-size="25" font-weight="700">交接、条件复核与变更</text><text x="40" y="84" fill="#94a3b8" font-size="15">收到文件不等于理解一致；每个未决项需要接手人和下一步</text><path d="M250 190H295" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M510 190H555" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M770 190H815" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="35" y="145" width="215" height="90" rx="9" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6"/><text x="142.5" y="177" text-anchor="middle" font-size="18" fill="#22d3ee">目标与承诺</text><text x="142.5" y="204" text-anchor="middle" font-size="14" fill="#cbd5e1">范围、依据、限制</text><rect x="295" y="145" width="215" height="90" rx="9" fill="#0f172a" stroke="#34d399" stroke-width="1.6"/><text x="402.5" y="177" text-anchor="middle" font-size="18" fill="#34d399">接手复核</text><text x="402.5" y="204" text-anchor="middle" font-size="14" fill="#cbd5e1">环境、数据、资源</text><rect x="555" y="145" width="215" height="90" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.6"/><text x="662.5" y="177" text-anchor="middle" font-size="18" fill="#a78bfa">实施与核对</text><text x="662.5" y="204" text-anchor="middle" font-size="14" fill="#cbd5e1">按有效版本执行</text><rect x="815" y="145" width="215" height="90" rx="9" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6"/><text x="922.5" y="177" text-anchor="middle" font-size="18" fill="#22d3ee">验收与维护</text><text x="922.5" y="204" text-anchor="middle" font-size="14" fill="#cbd5e1">结果、遗留、责任</text><path d="M665 235V310" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330 350H180V235" fill="none" stroke="#fb923c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="330" y="310" width="580" height="85" rx="9" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/><text x="620.0" y="342" text-anchor="middle" font-size="18" fill="#fb923c">变化先判断：缺陷、澄清、新增需求或外部条件变化</text><text x="620.0" y="369" text-anchor="middle" font-size="14" fill="#cbd5e1">评估影响并确认，再更新范围、方案、投入与用例</text><text x="40" y="482" text-anchor="start" font-size="14" fill="#94a3b8">原创示意图｜虚线表示变更确认后的回溯更新，非单方面修改承诺</text></g></svg>